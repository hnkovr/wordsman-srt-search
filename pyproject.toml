[project]
name = "srt-search"
version = "0.2.0"
description = "Multi-provider search library + CLI for English SRT subtitles of a selected movie"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "click>=8.1",
  "httpx>=0.27",
  "loguru>=0.7",
  "pydantic>=2.8",
  "pydantic-settings>=2.5",
  "pyyaml>=6.0",
]

[project.scripts]
srt-search = "srt_search.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "respx>=0.22",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/srt_search"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --cov=srt_search --cov-report=term-missing --cov-fail-under=85"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.coverage.report]
show_missing = true
exclude_also = ["if __name__ == .__main__.:", "# pragma: no cover"]
